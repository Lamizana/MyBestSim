[theme]
primaryColor = "#007bff"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f7f8fa"
textColor = "#1d2939"
borderColor = "#e4e7ec"
blueColor = "#007bff"
blueTextColor = "#0062cc"
redColor = "#de1414"
baseRadius = "small"
font = "Poppins:https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
headingFontSizes = ["2rem", "1.5rem", "1.15rem", "1rem", "0.95rem", "0.9rem"]
headingFontWeights = [700, 700, 700, 600, 600, 600]
metricValueFontSize = "1.55rem"
metricValueFontWeight = 700

[client]
toolbarMode = "viewer"

[browser]
gatherUsageStats = false

[server]
headless = true
